name: Collect Lenovo forum

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: lenovo-forum-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install forum collector dependencies
        run: python -m pip install --upgrade pip && pip install requests beautifulsoup4

      - name: Collect Lenovo forum discussions
        run: python scripts/collect_lenovo_forum.py

      - name: Commit forum data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lenovo_forum/
          if git diff --cached --quiet; then
            echo "No Lenovo forum data changes to commit."
            exit 0
          fi
          git commit -m "Update Lenovo forum archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after rebase."
            sleep 2
          done
          echo "Unable to push forum archive after 3 attempts."
          exit 1
