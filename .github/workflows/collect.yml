name: Collect YouTube comments

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-comment-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Search videos and collect comments
        run: python scripts/collect.py
        env:
          MAX_VIDEOS_PER_QUERY: "6"

      - name: Build recent and monthly analysis indexes
        run: python scripts/build_analysis_index.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments/ data/videos.json data/collection_report.json data/analysis/
          if git diff --cached --quiet; then
            echo "No YouTube data changes to commit."
          else
            git commit -m "Update YouTube comment archive"
            git push
          fi
